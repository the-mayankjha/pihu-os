[package]
name = "Pihu-OS"
version = "0.1.0"
description = "PIHU OS"
authors = ["Mayank Jha"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
tauri = { version = "2.0.0", features = ["macos-private-api"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.30"
