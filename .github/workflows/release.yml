name: Desktop releases

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.platform }} (${{ matrix.target || 'native' }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
          - platform: macos-latest
            target: x86_64-apple-darwin
          - platform: windows-latest
            target: ''
          - platform: ubuntu-22.04
            target: ''
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - name: Initialize the bundled MCP source submodule
        run: git -c submodule.recurse=false -c fetch.recurseSubmodules=false submodule update --init src-tauri/pihu_mcps

      - name: Verify release tag matches app version
        shell: bash
        run: |
          VERSION=$(node -p 'require("./package.json").version')
          test "$GITHUB_REF_NAME" = "v$VERSION"

      - name: Set release build name
        shell: bash
        run: echo "PIHU_BUILD_NAME=$(node -p 'require("./package.json").pihuBuildName || "Release"')" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'

      - name: Export Go toolchain for desktop build
        shell: bash
        run: |
          GO_ROOT="$(go env GOROOT)"
          echo "$GO_ROOT/bin" >> "$GITHUB_PATH"
          echo "GOROOT=$GO_ROOT" >> "$GITHUB_ENV"
          go version

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential curl file libasound2-dev libayatana-appindicator3-dev \
            librsvg2-dev libssl-dev libwebkit2gtk-4.1-dev patchelf pkg-config \
            python3-dev python3-venv rpm xdg-utils

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Build WhatsApp bridge runtime
        shell: bash
        run: |
          case "$RUNNER_OS" in
            macOS) GOOS=darwin; GOARCH=arm64 ;;
            Windows) GOOS=windows; GOARCH=amd64 ;;
            Linux) GOOS=linux; GOARCH=amd64 ;;
          esac
          case "$PIHU_TARGET" in
            aarch64-apple-darwin) GOOS=darwin; GOARCH=arm64 ;;
            x86_64-apple-darwin) GOOS=darwin; GOARCH=amd64 ;;
          esac
          OUTPUT=src-tauri/runtime/whatsapp-bridge/bridge
          if [ "$GOOS" = windows ]; then OUTPUT="$OUTPUT.exe"; fi
          mkdir -p src-tauri/runtime/whatsapp-bridge
          cd src-tauri/pihu_mcps/mcp/servers/pihu-whatsapp-mcp/whatsapp-bridge
          GOOS="$GOOS" GOARCH="$GOARCH" go build -trimpath -ldflags='-s -w' -o "$GITHUB_WORKSPACE/$OUTPUT" .
        env:
          PIHU_TARGET: ${{ matrix.target }}

      - name: Build and upload release assets
        uses: tauri-apps/tauri-action@action-v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY || '-' }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          PIHU_BRIDGE_PREBUILT: '1'
        with:
          tagName: v__VERSION__
          releaseName: Pihu OS v__VERSION__
          releaseBody: Installers and signed in-app updater bundles for macOS, Windows, and Linux.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.target != '' && format('--target {0}', matrix.target) || '' }}

  publish:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Publish complete release draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
        run: gh release edit "$TAG_NAME" --draft=false
