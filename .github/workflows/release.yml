name: Desktop releases

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.platform }} (${{ matrix.target || 'native' }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
          - platform: macos-15-intel
            target: x86_64-apple-darwin
          - platform: windows-latest
            target: ''
          - platform: ubuntu-22.04
            target: ''
    timeout-minutes: 90
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - name: Initialize the bundled MCP source submodule
        run: |
          git -c submodule.recurse=false -c fetch.recurseSubmodules=false submodule update --init src-tauri/pihu_mcps

      - name: Verify release tag matches app version
        shell: bash
        run: |
          VERSION=$(node -p 'require("./package.json").version')
          test "$GITHUB_REF_NAME" = "v$VERSION"

      - name: Set release build name
        shell: bash
        run: echo "PIHU_BUILD_NAME=$(node -p 'require("./package.json").pihuBuildName || "Release"')" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: '26.8.1'
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: astral-sh/setup-uv@v6

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'

      - name: Export Go toolchain for desktop build
        shell: bash
        run: |
          GO_ROOT="$(go env GOROOT)"
          echo "$GO_ROOT/bin" >> "$GITHUB_PATH"
          echo "GOROOT=$GO_ROOT" >> "$GITHUB_ENV"
          go version

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential curl file libasound2-dev libnss3 libgbm1 libayatana-appindicator3-dev \
            librsvg2-dev libssl-dev libwebkit2gtk-4.1-dev patchelf pkg-config \
            python3-dev python3-venv libportaudio2 libfuse2 rpm xdg-utils

      - name: Test account file access on a clean environment
        shell: bash
        run: |
          rustc --edition=2021 --test src-tauri/src/account_file.rs -o "$RUNNER_TEMP/pihu-account-tests.exe"
          "$RUNNER_TEMP/pihu-account-tests.exe"

      - name: Verify Windows background processes do not open a console
        if: runner.os == 'Windows'
        shell: bash
        run: |
          rustc --edition=2021 --test src-tauri/src/background_process.rs -o "$RUNNER_TEMP/pihu-background-tests.exe"
          "$RUNNER_TEMP/pihu-background-tests.exe"

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Read release notes
        id: release-notes
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync, existsSync, readFileSync } from 'node:fs';
          import { randomUUID } from 'node:crypto';
          const file = `docs/release-notes/${process.env.GITHUB_REF_NAME}.md`;
          const body = existsSync(file)
            ? readFileSync(file, 'utf8').trim()
            : 'Installers and signed in-app updater bundles for macOS, Windows, and Linux.';
          const delimiter = `PIHU_NOTES_${randomUUID()}`;
          appendFileSync(process.env.GITHUB_OUTPUT, `body<<${delimiter}\n${body}\n${delimiter}\n`);
          NODE

      - name: Enable CI-owned temporary DMG detach recovery
        if: runner.os == 'macOS'
        shell: bash
        run: echo "$GITHUB_WORKSPACE/bin/macos-ci:$PATH" >> "$GITHUB_PATH"

      - name: Build and upload release assets
        uses: tauri-apps/tauri-action@action-v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          PIHU_TARGET: ${{ matrix.target }}
          CI: 'true'
          TAURI_BUNDLER_DMG_IGNORE_CI: 'false'
          APPIMAGE_EXTRACT_AND_RUN: '1'
          NO_STRIP: 'true'
          LD_LIBRARY_PATH: ${{ runner.os == 'Linux' && format('{0}/src-tauri/runtime/native:{0}/src-tauri/runtime/python/lib:{0}/src-tauri/runtime/python/lib/python3.11/site-packages:{0}/src-tauri/runtime/python/lib/python3.11/site-packages/torch/lib:{0}/src-tauri/runtime/python/lib/python3.11/site-packages/onnxruntime/capi', github.workspace) || '' }}
        with:
          tagName: v__VERSION__
          releaseName: Pihu OS v__VERSION__
          releaseBody: ${{ steps.release-notes.outputs.body }}
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.platform == 'ubuntu-22.04' && '--verbose --bundles deb,appimage' || (matrix.target != '' && format('--verbose --target {0}', matrix.target) || '--verbose') }}

      - name: Preserve packaging diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: packaging-diagnostics-${{ matrix.platform }}-${{ matrix.target || 'native' }}
          if-no-files-found: ignore
          retention-days: 7
          path: |
            src-tauri/target/**/bundle/dmg/bundle_dmg.sh
            src-tauri/target/**/bundle/**/*.log

      - name: Verify macOS app signature before publishing
        if: runner.os == 'macOS'
        shell: bash
        env:
          PIHU_TARGET: ${{ matrix.target }}
        run: |
          APP="src-tauri/target/$PIHU_TARGET/release/bundle/macos/Pihu OS.app"
          test -f "$APP/Contents/_CodeSignature/CodeResources"
          codesign --verify --deep --strict --verbose=2 "$APP"

      - name: Validate installed runtime offline before publishing
        env:
          PIHU_TARGET: ${{ matrix.target }}
        shell: bash
        run: python bin/verify-packaged-runtime.py --target "$PIHU_TARGET"

  publish:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Publish complete release draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
        run: gh release edit "$TAG_NAME" --repo "$REPOSITORY" --draft=false
